name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push on the same branch/PR supersedes the running pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, xml
          coverage: none
          tools: composer:v2

      - run: composer validate

      - uses: ramsey/composer-install@v3

      - name: Lint
        run: find src tests demo autoloader.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (PHP ${{ matrix.php }}, ${{ matrix.engine }})
    needs: unit
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # All jobs share the same hosted database (tests reset its data), never run them in parallel
      max-parallel: 1
      matrix:
        php: ['8.2', '8.5']
        engine: [cwp, dataapi]
    env:
      FM_HOST: ${{ vars.FM_HOST }}
      FM_DATABASE: ${{ vars.FM_DATABASE }}
      FM_USER: ${{ secrets.FM_USER }}
      FM_PASSWORD: ${{ secrets.FM_PASSWORD }}
      FM_USE_DATA_API: ${{ matrix.engine == 'dataapi' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$FM_HOST" ] || [ -z "$FM_DATABASE" ] || [ -z "$FM_USER" ] || [ -z "$FM_PASSWORD" ]; then
            echo "::warning::Integration tests skipped: set FM_HOST/FM_DATABASE repository variables and FM_USER/FM_PASSWORD secrets"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.config.outputs.configured == 'true'
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, xml
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        if: steps.config.outputs.configured == 'true'

      - name: Run integration tests against ${{ vars.FM_DATABASE }}
        if: steps.config.outputs.configured == 'true'
        run: vendor/bin/phpunit --testsuite integration
